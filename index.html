<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>打赏支持 · Donate</title>
  <meta name="description" content="感谢您的支持。您的每一份心意，都是持续维护开源项目的动力。支持微信支付 / 支付宝。">
  <meta property="og:title" content="打赏支持 · Donate">
  <meta property="og:description" content="感谢您的支持。您的每一份心意，都是持续维护开源项目的动力。">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23c45c5c' d='M50 88C20 65 5 45 5 28 5 14 16 5 28 5c8 0 16 5 22 13 6-8 14-13 22-13 12 0 23 9 23 23 0 17-15 37-45 60z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="atmosphere" aria-hidden="true">
    <div class="mist mist-a"></div>
    <div class="mist mist-b"></div>
    <div class="ink-wash"></div>
  </div>

  <main class="page">
    <header class="hero">
      <p class="brand">打赏支持</p>
      <h1 class="hero-title">支持开发者 / 赞赏一下 / 请我喝杯咖啡</h1>
      <p class="hero-lead">多少不计，来去随心，感谢同行。</p>
    </header>

    <section class="donate-section" aria-label="打赏方式">
      <div class="donate-grid">
        <button class="donate-tile" type="button" data-open="wechat" aria-label="查看微信打赏码">
          <span class="tile-icon wechat" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/>
            </svg>
          </span>
          <span class="tile-label">微信打赏</span>
        </button>

        <button class="donate-tile" type="button" data-open="alipay" aria-label="查看支付宝打赏码">
          <span class="tile-icon alipay" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.695 15.07c3.426 1.158 4.203 1.22 4.203 1.22V3.846c0-2.124-1.705-3.845-3.81-3.845H3.914C1.808.001.102 1.722.102 3.846v16.31c0 2.123 1.706 3.845 3.813 3.845h16.173c2.105 0 3.81-1.722 3.81-3.845v-.157s-6.19-2.602-9.315-4.119c-2.096 2.602-4.8 4.181-7.607 4.181-4.75 0-6.361-4.19-4.112-6.949.49-.602 1.324-1.175 2.617-1.497 2.025-.502 5.247.313 8.266 1.317a16.796 16.796 0 0 0 1.341-3.302H5.781v-.952h4.799V6.975H4.77v-.953h5.81V3.591s0-.409.411-.409h2.347v2.84h5.744v.951h-5.744v1.704h4.69a19.453 19.453 0 0 1-1.986 5.06c1.424.52 2.702 1.011 3.654 1.333m-13.81-2.032c-.596.06-1.71.325-2.321.869-1.83 1.608-.735 4.55 2.968 4.55 2.151 0 4.301-1.388 5.99-3.61-2.403-1.182-4.438-2.028-6.637-1.809"/>
            </svg>
          </span>
          <span class="tile-label">支付宝打赏</span>
        </button>
      </div>
    </section>

    <section class="explore" aria-labelledby="explore-title">
      <h2 class="explore-title" id="explore-title">探索更多内容</h2>
      <div class="explore-grid">
        <a class="explore-card" href="https://github.com/zhengqingquan" target="_blank" rel="noopener noreferrer">
          <span class="explore-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.26.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.757-1.333-1.757-1.09-.745.083-.73.083-.73 1.205.085 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.76-1.605-2.665-.303-5.467-1.333-5.467-5.931 0-1.31.468-2.381 1.236-3.221-.124-.303-.536-1.524.117-3.176 0 0 1.008-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.29-1.552 3.297-1.23 3.297-1.23.653 1.652.241 2.873.118 3.176.77.84 1.235 1.91 1.235 3.221 0 4.61-2.807 5.625-5.48 5.921.43.372.814 1.103.814 2.222 0 1.606-.015 2.896-.015 3.286 0 .32.216.694.825.576C20.565 21.796 24 17.297 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
          </span>
          <span class="explore-body">
            <span class="explore-name">GitHub</span>
            <span class="explore-desc">查看开源项目与代码仓库</span>
          </span>
        </a>
        <a class="explore-card" href="https://zhengqingquan.github.io" target="_blank" rel="noopener noreferrer">
          <span class="explore-icon home" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 11.5 12 4l9 7.5"/>
              <path d="M6 10.5V20h12v-9.5"/>
            </svg>
          </span>
          <span class="explore-body">
            <span class="explore-name">个人主页</span>
            <span class="explore-desc">阅读博客与更多介绍</span>
          </span>
        </a>
      </div>
    </section>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-title">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel" role="document">
        <button class="modal-close" type="button" data-close aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
        <h2 class="modal-title" id="modal-title">微信打赏</h2>
        <p class="modal-tip">请使用微信扫一扫下方赞赏码完成打赏</p>
        <div class="qrcode-wrap">
          <img id="modal-qrcode" class="qrcode" alt="收款二维码" src="" draggable="false">
          <p class="qrcode-placeholder" id="qrcode-placeholder" hidden>请将收款码图片放到 <code>image/</code> 目录</p>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>© <span id="year"></span> · 感谢每一位支持者</p>
      <p class="footer-meta">Deployed with GitHub Pages</p>
    </footer>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
